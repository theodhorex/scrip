[package]
name = "amanat_naive"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["naive"]
naive = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
strip = true
