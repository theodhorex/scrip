[package]
name = "scrip"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "=1.52.3", features = ["full"] }
serde_json = "=1.0.154"
proptest = "1.12.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
strip = true
